[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-motion-preprocessing"
version = "0.1.0"
description = "Adaptive motion preprocessing: video frames in, encoded motion images out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python"]

[tool.hatch.build.targets.wheel]
packages = ["src/amprep"]
